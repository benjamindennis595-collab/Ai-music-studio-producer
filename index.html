<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Studio Producer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .studio {
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(145deg, #171717, #050505);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #202020;
      border: 1px solid #333;
      border-radius: 12px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #aaa;
    }

    .booth {
      margin-top: 20px;
      padding: 30px 20px;
      text-align: center;
      background: #191919;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .booth h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .booth p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .record-button {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 8px solid #333;
      background: #b00020;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .timer {
      margin-top: 20px;
      font-size: 28px;
      font-family: monospace;
    }

    .waveform {
      margin-top: 25px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .waveform span {
      width: 4px;
      height: 25px;
      background: #777;
      border-radius: 5px;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.secondary {
      padding: 12px 18px;
      background: #292929;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
    }

    .mixer {
      margin-top: 20px;
      padding: 20px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .mixer h2 {
      margin-top: 0;
    }

    .channels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .channel {
      padding: 15px 8px;
      text-align: center;
      background: #242424;
      border-radius: 10px;
    }

    .meter {
      height: 80px;
      width: 8px;
      margin: 10px auto;
      background: #444;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .meter::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: #aaa;
    }

    .final {
      margin-top: 20px;
      padding: 20px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 15px;
      text-align: center;
    }

    .final button {
      margin: 5px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    @media (max-width: 600px) {
      .channels {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="studio">

    <div class="header">
      <div class="logo">AI MUSIC STUDIO</div>
      <div class="status">PRODUCER ONLINE</div>
    </div>

    <div class="booth">

      <h1>RECORD YOUR DEMO</h1>

      <p>
        Sing your complete song exactly the way you want it performed.
      </p>

      <button class="record-button">
        RECORD
      </button>

      <div class="timer">
        00:00
      </div>

      <div class="waveform">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="controls">
        <button class="secondary">▶ Play</button>
        <button class="secondary">⏸ Pause</button>
        <button class="secondary">⏹ Stop</button>
        <button class="secondary">Upload Demo</button>
      </div>

    </div>

    <div class="mixer">

      <h2>AI PRODUCER MIXER</h2>

      <div class="channels">

        <div class="channel">
          DRUMS
          <div class="meter"></div>
        </div>

        <div class="channel">
          BASS
          <div class="meter"></div>
        </div>

        <div class="channel">
          KEYS
          <div class="meter"></div>
        </div>

        <div class="channel">
          GUITAR
          <div class="meter"></div>
        </div>

        <div class="channel">
          PADS
          <div class="meter"></div>
        </div>

        <div class="channel">
          STRINGS
          <div class="meter"></div>
        </div>

      </div>

    </div>

    <div class="final">

      <h2>YOUR PRODUCED SONG</h2>

      <p>
        Your demo vocals + AI produced instrumental
      </p>

      <button>▶ Play Full Song</button>
      <button>Download Full Song</button>
      <button>Separation</button>

    </div>

  </div>

</body>
</html>
