<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Music Studio Producer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .studio {
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(145deg, #171717, #050505);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #202020;
      border: 1px solid #333;
      border-radius: 12px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #aaa;
    }

    .booth {
      margin-top: 20px;
      padding: 30px 20px;
      text-align: center;
      background: #191919;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .booth h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .booth p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .record-button {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 8px solid #333;
      background: #b00020;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .timer {
      margin-top: 20px;
      font-size: 28px;
      font-family: monospace;
    }

    .waveform {
      margin-top: 25px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .waveform span {
      width: 4px;
      height: 25px;
      background: #777;
      border-radius: 5px;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.secondary {
      padding: 12px 18px;
      background: #292929;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
    }

    .mixer {
      margin-top: 20px;
      padding: 20px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .mixer h2 {
      margin-top: 0;
    }

    .channels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .channel {
      padding: 15px 8px;
      text-align: center;
      background: #242424;
      border-radius: 10px;
    }

    .meter {
      height: 80px;
      width: 8px;
      margin: 10px auto;
      background: #444;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .meter::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: #aaa;
    }

    .final {
      margin-top: 20px;
      padding: 20px;
      background: #191919;
      border: 1px solid #333;
      border-radius: 15px;
      text-align: center;
    }

    .final button {
      margin: 5px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    @media (max-width: 600px) {
      .channels {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="studio">

    <div class="header">

    </div>

    <div class="booth">

      <h1>RECORD YOUR DEMO</h1>

      <p>
        Sing your complete song exactly the way you want it performed.
      </p>

      <button class="record-button" id="recordButton">
  RECORD
</button>
        
   

      <div class="timer">
        00:00
      </div>

      <div class="waveform">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="controls">
        <button class="secondary">▶ Play</button>
        <button class="secondary">⏸ Pause</button>
        <button class="secondary">⏹ Stop</button>

<button class="secondary" id="uploadDemoBtn">UPLOAD DEMO</button>

    <div class="mixer">

<button id="produceBtn" class="primary">START AI PRODUCER</button>

<div id="producerStatus" style="margin-top:15px;">
  Waiting for your demo...
</div>
      <div class="channels">



        <div class="channel">

      </p>

      <button>▶ Play Full Song</button>
      <button>Download Full Song</button>
      <button>Separation</button>

    </div>

  </div>
<script>
  let mediaRecorder;
  let audioChunks = [];
  let recording = false;
  let audioPlayer = null;
  let audioURL = null;
  let microphoneStream = null;

  const recordButton = document.getElementById("recordButton");

  recordButton.addEventListener("click", async () => {

    if (!recording) {

      try {

        // Request improved microphone recording
        microphoneStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
            sampleRate: 48000
          }
        });

        const audioTracks = microphoneStream.getAudioTracks();

        console.log("Microphone:", audioTracks[0].label);

        // Use a high-quality audio format when supported
        let recorderOptions = {};

        if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
          recorderOptions = {
            mimeType: "audio/webm;codecs=opus",
            audioBitsPerSecond: 128000
          };
        }

        mediaRecorder = new MediaRecorder(
          microphoneStream,
          recorderOptions
        );

        audioChunks = [];

        mediaRecorder.ondataavailable = event => {

          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }

        };

        mediaRecorder.onstop = () => {

          const audioBlob = new Blob(audioChunks, {
            type: mediaRecorder.mimeType || "audio/webm"
          });

          audioURL = URL.createObjectURL(audioBlob);

          // Create audio player
          audioPlayer = document.createElement("audio");

          audioPlayer.controls = true;
          audioPlayer.src = audioURL;

          audioPlayer.style.width = "100%";
          audioPlayer.style.marginTop = "20px";

          document.querySelector(".booth").appendChild(audioPlayer);

          // Create DELETE TAKE button
          const deleteButton = document.createElement("button");

          deleteButton.textContent = "DELETE TAKE";

          deleteButton.style.display = "block";
          deleteButton.style.margin = "15px auto 0";
          deleteButton.style.padding = "12px 22px";
          deleteButton.style.background = "#8b0000";
          deleteButton.style.color = "white";
          deleteButton.style.border = "none";
          deleteButton.style.borderRadius = "8px";
          deleteButton.style.fontWeight = "bold";
          deleteButton.style.cursor = "pointer";

          document.querySelector(".booth").appendChild(deleteButton);

          // Delete the recording
          deleteButton.addEventListener("click", () => {

            if (audioPlayer) {
              audioPlayer.pause();
              audioPlayer.remove();
              audioPlayer = null;
            }

            if (audioURL) {
              URL.revokeObjectURL(audioURL);
              audioURL = null;
            }

            audioChunks = [];

            deleteButton.remove();

            alert("Take deleted. You can record a fresh take.");

          });

        };

        mediaRecorder.start();

        recording = true;

        recordButton.textContent = "STOP";
        recordButton.style.background = "#444";

      } catch (error) {

        console.error(error);

        alert(
          "Microphone access failed. Please allow microphone permission and try again."
        );

      }

    } else {

      // Stop recording
      mediaRecorder.stop();

      // Stop microphone
      if (microphoneStream) {

        microphoneStream.getTracks().forEach(track => {
          track.stop();
        });

        microphoneStream = null;
      }

      recording = false;

      recordButton.textContent = "RECORD";
      recordButton.style.background = "#b00020";

    }

  });
const demoUpload = document.getElementById("demoUpload");
const uploadDemoBtn = document.getElementById("uploadDemoBtn");

uploadDemoBtn.onclick = () => {
  demoUpload.click();
};

demoUpload.onchange = () => {
  const file = demoUpload.files[0];

  if (!file) return;

  const audioURL = URL.createObjectURL(file);

  const oldPlayer = document.getElementById("uploadedDemoPlayer");
  if (oldPlayer) oldPlayer.remove();

  const player = document.createElement("audio");
  player.id = "uploadedDemoPlayer";
  player.controls = true;
  player.src = audioURL;
  player.style.width = "100%";
  player.style.marginTop = "15px";

  document.querySelector(".booth").appendChild(player);

  alert("Demo uploaded successfully. Your demo is ready for the AI Producer.");
};

demoUpload.addEventListener("change", async () => {
  const file = demoUpload.files[0];

  if (!file) return;

  producerStatus.textContent = "Uploading demo to studio...";

  const fileName = Date.now() + "-" + file.name;

  const { error } = await supabaseClient.storage
    .from("demo-audio")
    .upload(fileName, file);

  if (error) {
    console.error(error);
    producerStatus.textContent = "Upload failed: " + error.message;
    alert("Upload failed: " + error.message);
    return;
  }

  producerStatus.textContent = "Demo saved to the studio.";
  alert("Demo uploaded and saved successfully.");
});



  
  

    



const produceBtn = document.getElementById("produceBtn");
const producerStatus = document.getElementById("producerStatus");

produceBtn.onclick = () => {
  const recordedDemo = document.querySelector("audio");
  const uploadedDemo = document.getElementById("uploadedDemoPlayer");

  if (!recordedDemo && !uploadedDemo) {
    alert("Please record or upload your complete demo first.");
    return;
  }

  produceBtn.disabled = true;
  produceBtn.textContent = "PRODUCING...";

  producerStatus.textContent = "Analyzing your demo...";

  setTimeout(() => {
    producerStatus.textContent = "Detecting melody and tempo...";
  }, 2000);

  setTimeout(() => {
    producerStatus.textContent = "Mapping vocal rhythm and song structure...";
  }, 4000);

  setTimeout(() => {
    producerStatus.textContent = "Designing the instrumental arrangement...";
  }, 6000);

  setTimeout(() => {
    producerStatus.textContent = "AI Producer is ready for the instrumental engine.";
    produceBtn.disabled = false;
    produceBtn.textContent = "START AI PRODUCER";
  }, 8000);
};
const SUPABASE_URL = "your-project-url";
const SUPABASE_KEY = "your-publishable-key";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>
</body>
</html>
